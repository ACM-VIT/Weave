name: Verify private scoring persistence

on:
  pull_request:
    paths: ['backend/**', 'database/**', '.github/workflows/scoring-persistence.yml']
  push:
    branches: [dev, main, master]
    paths: ['backend/**', 'database/**', '.github/workflows/scoring-persistence.yml']

permissions:
  contents: read

jobs:
  private-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: weave_scroll
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/weave_scroll
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:test
      - name: Validate packets and permission recovery
        run: npx --no-install tsx --test tests/scoring/*.test.ts
      # This must be the first database step: its guard requires an EMPTY
      # dedicated database, and it performs actual fresh + pre-capture upgrades.
      - name: Exercise fresh migration and upgrade with schema audit
        run: npx --no-install tsx --test tests/migrations/scoringCaptureUpgrade.integration.test.ts
        env:
          RUN_SCORING_MIGRATION_INTEGRATION: '1'
      - name: Bound publication repair lookups by captured generation
        run: npx --no-install tsx --test tests/database/scoringRepairIndex.integration.test.ts
        env:
          RUN_SCORING_REPAIR_INTEGRATION: '1'
      - name: Exercise immutable storage, SQL faults and least-privilege roles
        run: npx --no-install tsx --test tests/database/scoringPersistence.integration.test.ts
        env:
          RUN_DATABASE_INTEGRATION: '1'
      - name: Exercise captured publication, durable recovery and process death
        run: >-
          npx --no-install tsx --test --test-concurrency=1
          tests/database/capturedGeneration.integration.test.ts
          tests/database/feedItemProvenance.integration.test.ts
          tests/database/capturedCrash.integration.test.ts
        env:
          RUN_DATABASE_INTEGRATION: '1'
          RUN_REDIS_INTEGRATION: '1'
      - name: Exercise full-schema protected exports, concurrent grants and real API retention
        run: >-
          npx --no-install tsx --test --test-concurrency=1
          tests/database/scoringExportConcurrency.integration.test.ts
          tests/http/scoringExport.integration.test.ts
          tests/http/impressionReference.integration.test.ts
        env:
          RUN_DATABASE_INTEGRATION: '1'
          RUN_REDIS_INTEGRATION: '1'
          RUN_SCORING_EXPORT_INTEGRATION: '1'
          RUN_IMPRESSION_LINKAGE_INTEGRATION: '1'
      - name: Prepare pinned isolated export fixture image
        run: docker pull postgres@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
      - name: Exercise export permissions, frozen cutoffs and revocation in an owned container
        run: npx --no-install tsx --test tests/database/scoringExport.integration.test.ts
        env:
          RUN_SCORING_EXPORT_OWNED: '1'
