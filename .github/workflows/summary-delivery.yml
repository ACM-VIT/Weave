name: Verify summary delivery persistence

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/summary-delivery.yml']
  push:
    branches: [dev, main, master]
    paths: ['backend/**', '.github/workflows/summary-delivery.yml']

permissions:
  contents: read

jobs:
  delivery-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: weave_scroll
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d weave_scroll"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/weave_scroll
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:test
      - run: npm run migrate
        env:
          BOOTSTRAP_SUPABASE_AUTH_STUB: '1'
      - name: Verify HTTP, SQL completion, recovery and durable feed readback
        run: >-
          npx --no-install tsx --test --test-concurrency=1
          tests/database/feedPersistence.integration.test.ts
          tests/database/repositorySummary.integration.test.ts
          tests/database/repositorySummaryGuard.test.ts
          tests/database/summaryDelivery.integration.test.ts
        env:
          RUN_DATABASE_INTEGRATION: '1'
          RUN_SUMMARY_DELIVERY_INTEGRATION: '1'
