name: Durable activity recovery

on:
  pull_request:
  push:
    branches: [dev, main, master]

permissions:
  contents: read

jobs:
  activity-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: weave_scroll
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/weave_scroll
      NODE_ENV: test
      REDIS_DATABASE_TEST_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
        env:
          BOOTSTRAP_SUPABASE_AUTH_STUB: '1'
      - run: npx --no-install tsx --test tests/database/activityReliability.integration.test.ts
        env:
          RUN_ACTIVITY_RELIABILITY_INTEGRATION: '1'
