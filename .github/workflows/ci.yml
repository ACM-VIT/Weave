name: Verify GitSocial

on:
  pull_request:
  push:
    branches: [dev, main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BACKEND_URL: https://api.example.invalid/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run doctor
      - run: npx expo install --check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run export:all -- --output-dir dist

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: weave_phase4
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/weave_phase4
      REDIS_URL: redis://127.0.0.1:6379
      RUN_SEARCH_INTEGRATION: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run ml:check
      - run: npm run build
      - run: npm run migrate
        env:
          BOOTSTRAP_SUPABASE_AUTH_STUB: '1'
      - run: npm test
      - name: Exercise authenticated V2 HTTP flows
        timeout-minutes: 5
        run: npx --no-install tsx --test tests/http/apiV2.integration.test.ts
        env:
          RUN_HTTP_INTEGRATION: '1'
          NODE_ENV: test
          # Synthetic credentials for the disposable CI database and fixtures.
          JWT_SECRET: ci-only-v2-http-signing-key-not-for-production
          INTERNAL_API_SECRET: ci-only-v2-http-internal-key-not-for-production
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_KEY: ci-only-supabase-public-key
          SUPABASE_SERVICE_ROLE_KEY: ci-only-supabase-service-key
          CLIENT_URL: http://localhost:8081/callback
          BACKEND_URL: http://127.0.0.1:3000
      - name: Build production image
        working-directory: .
        run: |
          docker build -f backend/Dockerfile -t gh-social-backend:${{ github.sha }} .
          docker run --rm --entrypoint node gh-social-backend:${{ github.sha }} dist/scripts/verify-deployment-assets.js

  ml-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: weave_scroll
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/weave_scroll
      REDIS_URL: redis://127.0.0.1:6379/15
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read the pinned provider release
        id: provider
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('backend/contracts/ml-contract-release.json', 'utf8'));
          if (release.repository !== 'ACM-VIT/Weave-ml' || !/^[a-f0-9]{40}$/.test(release.revision)) throw new Error('Invalid provider release');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${release.revision}\n`);
          NODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ACM-VIT/Weave-ml
          ref: ${{ steps.provider.outputs.revision }}
          path: .contract-provider
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.13.4'
      - run: uv sync --locked --dev
        working-directory: .contract-provider
      - run: npm ci
        working-directory: backend
      - run: npm run ml:check
        working-directory: backend
      - run: npm run migrate
        working-directory: backend
        env:
          BOOTSTRAP_SUPABASE_AUTH_STUB: '1'
      - run: npx --no-install tsx --test --test-concurrency=1 tests/contracts/mlCrossRepo.integration.test.ts tests/contracts/socialCrossRepo.integration.test.ts tests/contracts/lineageCrossRepo.integration.test.ts tests/contracts/outboxFeedback.integration.test.ts tests/database/outboxLanes.integration.test.ts
        working-directory: backend
        env:
          WEAVE_ML_CONTRACT_ROOT: ${{ github.workspace }}/.contract-provider
          RUN_OUTBOX_FEEDBACK_CONTRACT: '1'
          RUN_OUTBOX_LANES_INTEGRATION: '1'
