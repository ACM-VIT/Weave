name: Verify GitSocial

on:
  pull_request:
  push:
    branches: [dev, main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BACKEND_URL: https://api.example.invalid/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run doctor
      - run: npx expo install --check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run export:all -- --output-dir dist

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: weave_phase4
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/weave_phase4
      REDIS_URL: redis://127.0.0.1:6379
      RUN_SEARCH_INTEGRATION: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run migrate
        env:
          BOOTSTRAP_SUPABASE_AUTH_STUB: '1'
      - run: npm test
      - name: Build production image
        working-directory: .
        run: |
          docker build -f backend/Dockerfile -t gh-social-backend:${{ github.sha }} .
          docker run --rm --entrypoint node gh-social-backend:${{ github.sha }} dist/scripts/verify-deployment-assets.js
