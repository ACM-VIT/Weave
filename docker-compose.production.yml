name: weave-backend

x-backend-service: &backend-service
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
  env_file:
    - .env
  environment:
    REDIS_URL: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 30s
  networks:
    - backend
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    <<: *backend-service
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5000/healthz').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  outbox-worker:
    <<: *backend-service
    command: ["node", "dist/worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_ROLE: outbox
    healthcheck:
      disable: true

  feed-worker:
    <<: *backend-service
    command: ["node", "dist/worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_ROLE: feed
    healthcheck:
      disable: true

  maintenance-worker:
    <<: *backend-service
    command: ["node", "dist/worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_ROLE: maintenance
    healthcheck:
      disable: true

  proxy:
    image: caddy:2.10-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  backend:
    driver: bridge

volumes:
  redis-data:
  caddy-data:
  caddy-config:
